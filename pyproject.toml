[project]
name = "clinicbrain"
version = "1.5.0"
description = "緻妍診所 Taiwan PageIndex RAG 系統 (Taiwan Clinic Medical PageIndex RAG System)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Hsu Yung Feng", email = "hsuyungfeng@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "opencc>=1.1.9",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
video = [
    "playwright>=1.40.0",
]
pdf = [
    "pymupdf>=1.24.0",
    "markitdown>=0.0.1a4",
]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]
all = [
    "clinicbrain[video,pdf,dev]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scratch", "OriginalData", ".planning", "demo"]
